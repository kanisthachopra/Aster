<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recording guide verification</title><link rel="stylesheet" href="/src/styles.css"></head>
<body style="background:#091a24"><div id="root" style="max-width:680px; margin:20px auto; padding:20px; overflow:auto; height:calc(100% - 40px)"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import RecordingGuide from '/src/components/RecordingGuide.tsx';
import {EXERCISES} from '/src/game/types.ts';
const params=new URLSearchParams(location.search);
const exercise=EXERCISES.find(item=>item.id===params.get('exercise'))||EXERCISES[0];
window.guideSpeech=[];
createRoot(document.getElementById('root')).render(React.createElement(RecordingGuide,{exercise,reducedMotion:params.has('reduce'),onSpeak:text=>window.guideSpeech.push(text)}));
</script></body></html>
